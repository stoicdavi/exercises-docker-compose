services:
  frontend:
    image: daviddean181/frontend
  backend:
    image: daviddean181/backend
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: example
      POSTGRES_USER: example
      
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_USER: example

    volumes:
      - ./database:/var/lib/postgresql
  nginx:
    image: nginx
    depends_on:
      - backend
      - frontend
    environment:
      POSTGRES_USER: example
      POSTGRES_PASSWORD: example
    ports:
      - 8000:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
