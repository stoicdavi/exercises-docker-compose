services:
  frontend:
    image: daviddean181/frontend
    ports:
      - "5001:5001"
  backend:
    image: daviddean181/backend
    ports:
      - "8080:8080"
    environment: 
      REDIS_HOST: redis
    depends_on:
      - redis
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes 
